; OpenKIS PHP settings
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = ${TZ}
expose_php = Off
session.cookie_httponly = 1
; APCu (finis cross-request cache, map exports). A 3000-cave export set is
; about 7 MB per user and filter, so leave room above the 32M default.
apc.shm_size = 128M
