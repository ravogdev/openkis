; OpenKIS PHP settings
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = ${TZ}
expose_php = Off
session.cookie_httponly = 1
; APCu (finis cross-request cache, map exports). With 10000 caves the four
; map exports take about 22 MB per user and filter (measured), so 256M keeps
; about ten such sets; the 32M default would hold only one.
apc.shm_size = 256M
